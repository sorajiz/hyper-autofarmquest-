[package]
name = "hyper-rust-engine"
version = "3.3.0"
edition = "2021"
authors = ["sorajiz"]
description = "Hyper AutoFarm Quest - High Performance Rust Native Game Process Sleeper & Discord RPC"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
colored = "2.1"
log = "0.4"
